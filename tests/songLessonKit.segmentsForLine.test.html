<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body>
<script>
// Minimal stub so SongLessonKit's top-level `const { p, narrow, ... } = LessonKit`
// destructuring doesn't throw. render()/mount() (which need the real RecordingCard,
// icon, etc.) are never called by this test — only the pure segmentsForLine/measured
// helpers are, so no other app script needs to load.
window.LessonKit = { p: () => "", narrow: () => "", chapter: () => "", wireViewedSentinel: () => () => {}, wireStepper: () => () => {} };
</script>
<script src="../js/lessons/songLessonKit.js"></script>
<script>
const assert = {
  strictEqual(a, b, msg) { if (a !== b) throw new Error(msg || `expected ${b}, got ${a}`); },
};

try {
  const song = {
    reference: {
      segments: [
        { swara: "Sa", line: 0, covers: ["Oo", "Na", "n", "na"] },
        { swara: "Ni", line: 0, covers: ["Che", "tha", "na"] },
        { swara: "Pa", line: 1, covers: ["Aa", "gu", "Nee", "a-ni", "ke"] },
        { swara: "Sa (lower)", line: 1, covers: ["ta", "na"] },
        { swara: null, line: null, covers: [] },
      ],
    },
  };

  // Post-review fix (Important #3): "na" appears in both lines' covers, so a
  // text-matching approach would incorrectly pull line-1 segments into line 0's
  // results (and vice versa). The `line` index must be the only thing that matters.
  const line0 = SongLessonKit.segmentsForLine(song, 0);
  assert.strictEqual(line0.length, 2, `line 0 should have exactly its 2 segments, got ${line0.length}`);
  assert.strictEqual(line0[0].swara, "Sa");
  assert.strictEqual(line0[1].swara, "Ni");

  const line1 = SongLessonKit.segmentsForLine(song, 1);
  assert.strictEqual(line1.length, 2, `line 1 should have exactly its 2 segments, got ${line1.length}`);
  assert.strictEqual(line1[0].swara, "Pa");
  assert.strictEqual(line1[1].swara, "Sa (lower)");

  // measured() excludes the uncertain (swara: null) segment
  assert.strictEqual(SongLessonKit.measured(song).length, 4);

  // syllablesForLine/allSyllables: positional mapping (per-syllable note display).
  // Line 0's rhythm has 4 syllable cells ("Oo","Na","n","na" then "Che","tha","na")
  // split across 2 rows; segment 0 covers the first 4, segment 1 covers the next 3.
  // "na" appears as a syllable text in BOTH segments here — if the mapping were
  // text-based (not positional/count-based) it could mismatch, so this also guards
  // against reintroducing the Important #3 bug class at the syllable level.
  const songWithRhythm = {
    reference: song.reference,
    lines: [
      { rhythm: [
        { tha: "Oo", ki: "Na", ta: "n" },
        { tha: "na", ki: "Che", ta: "tha" },
        { tha: "na", ki: "–", ta: "–" },
      ] },
      { rhythm: [
        { tha: "Aa", ki: "gu", ta: "Nee" },
        { tha: "a-ni", ki: "ke", ta: "ta" },
        { tha: "na", ki: "–", ta: "–" },
      ] },
    ],
  };

  const syl0 = SongLessonKit.syllablesForLine(songWithRhythm, 0);
  assert.strictEqual(syl0.length, 7, `line 0 should have 7 syllable cells, got ${syl0.length}`);
  ["Oo", "Na", "n", "na", "Che", "tha", "na"].forEach((text, i) => assert.strictEqual(syl0[i].text, text));
  // first 4 syllables ("Oo","Na","n","na") come from segment 0 (swara "Sa")
  [0, 1, 2, 3].forEach(i => assert.strictEqual(syl0[i].swara, "Sa", `syllable ${i} ("${syl0[i].text}") should map to segment 0`));
  // next 3 ("Che","tha","na") come from segment 1 (swara "Ni") — note the second
  // "na" (index 6) must still resolve to "Ni", not fall back to segment 0's "Sa"
  // just because the text matches an earlier syllable.
  [4, 5, 6].forEach(i => assert.strictEqual(syl0[i].swara, "Ni", `syllable ${i} ("${syl0[i].text}") should map to segment 1`));

  const syl1 = SongLessonKit.syllablesForLine(songWithRhythm, 1);
  assert.strictEqual(syl1.length, 7, `line 1 should have 7 syllable cells, got ${syl1.length}`);
  [0, 1, 2, 3, 4].forEach(i => assert.strictEqual(syl1[i].swara, "Pa", `syllable ${i} ("${syl1[i].text}") should map to segment 2`));
  [5, 6].forEach(i => assert.strictEqual(syl1[i].swara, "Sa (lower)", `syllable ${i} ("${syl1[i].text}") should map to segment 3`));

  const all = SongLessonKit.allSyllables(songWithRhythm);
  assert.strictEqual(all.length, 14, `allSyllables should concat both lines, got ${all.length}`);
  assert.strictEqual(all[0].text, "Oo");
  assert.strictEqual(all[13].text, "na");
  assert.strictEqual(all[13].swara, "Sa (lower)");

  // Phrase model: when a line has its own `phrases` (teacher-provided phrase/beat
  // mapping — see `phrase()` in songs.js), syllablesForLine must read beats straight
  // from it, one entry per beat (3 per phrase) — including a beat that holds the
  // PREVIOUS phrase's pitch (`sustain: true`) rather than starting a new one.
  const phraseSong = {
    lines: [
      {
        phrases: [
          { label: "P1", beats: [
            { syl: "Oo", sustain: false, midi: 70, western: "A♯4", swara: "Sa", confidence: "by ear" },
            { syl: null, sustain: true, midi: 70, western: "A♯4", swara: "Sa", confidence: "by ear" },
            { syl: null, sustain: true, midi: 70, western: "A♯4", swara: "Sa", confidence: "by ear" },
          ] },
          { label: "P2", beats: [
            { syl: "Na", sustain: false, midi: 69, western: "A4", swara: "Ni (lower)", confidence: "by ear" },
            { syl: null, sustain: true, midi: 69, western: "A4", swara: "Ni (lower)", confidence: "by ear" },
            { syl: null, sustain: true, midi: 69, western: "A4", swara: "Ni (lower)", confidence: "by ear" },
          ] },
        ],
        gapBeats: 2,
      },
      {
        phrases: [{ label: "P3", beats: [
          { syl: "Ke", sustain: false, midi: 64, western: "E4", swara: null, confidence: "by ear" },
          { syl: null, sustain: true, midi: 64, western: "E4", swara: null, confidence: "by ear" },
          { syl: "ta", sustain: false, midi: 58, western: "A♯3", swara: "Sa (lower octave)", confidence: "by ear" },
        ] }],
        gapBeats: 2,
      },
    ],
  };
  const beats = SongLessonKit.syllablesForLine(phraseSong, 0);
  assert.strictEqual(beats.length, 6, `2 phrases of 3 beats each = 6, got ${beats.length}`);
  assert.strictEqual(beats[0].text, "Oo");
  assert.strictEqual(beats[0].sustain, false);
  assert.strictEqual(beats[1].sustain, true, "a phrase beat with no new syllable is still a sounding (held) beat");
  assert.strictEqual(beats[1].swara, "Sa", "a held beat still carries its own note");
  assert.strictEqual(beats[3].text, "Na");
  assert.strictEqual(beats[3].swara, "Ni (lower)");

  // linePlaybackPlan/songPlaybackPlan: every beat PLUS the line's trailing gap beats
  // (true rests, addressed as `{ gap: true }` rather than a beat cell) must appear in
  // both `cells` (for the audio engine) and `addresses` (for highlighting), in lockstep.
  const plan0 = SongLessonKit.linePlaybackPlan(phraseSong, 0);
  assert.strictEqual(plan0.cells.length, 8, `6 beats + 2 gap cells = 8, got ${plan0.cells.length}`);
  assert.strictEqual(plan0.addresses.length, 8);
  assert.strictEqual(plan0.cells[6].midi, null, "the 2 trailing gap cells are true rests");
  assert.strictEqual(plan0.addresses[6].gap, true, "a gap cell's address is flagged `gap`, not a beat cell index");
  assert.strictEqual(plan0.addresses[0].line, 0);
  assert.strictEqual(plan0.addresses[0].cell, 0);

  const bothPlan = SongLessonKit.songPlaybackPlan(phraseSong, "both");
  assert.strictEqual(bothPlan.cells.length, 8 + 5, `line 0's 8 + line 1's (3 beats + 2 gap) = 13, got ${bothPlan.cells.length}`);
  assert.strictEqual(bothPlan.addresses[8].line, 1, "line 1's beats must carry line:1 in their address, not keep line 0's");

  const phrasePlan = SongLessonKit.songPlaybackPlan(phraseSong, { line: 1, phrase: 0 });
  assert.strictEqual(phrasePlan.cells.length, 3, "a single-phrase scope is exactly 3 beats, no gap");
  assert.strictEqual(phrasePlan.cells[2].midi, 58);

  // timelineToEvents: a `sustain` beat continuing the SAME pitch extends the previous
  // note's duration; a true rest becomes an actual pause and consecutive rests merge
  // into one longer pause — so a tempo change scales every phrase, sustain, and gap
  // proportionally from a single pass over the cells list.
  const events = SongLessonKit.timelineToEvents(plan0.cells, 0.5);
  // Oo + its 2 held beats merge into 1 note; Na + its 2 held beats merge into 1 note;
  // the 2 trailing gap cells merge into 1 rest — 3 events total, not 8.
  assert.strictEqual(events.length, 3, `expected 3 merged events, got ${events.length}`);
  assert.strictEqual(events[0].midi, 70);
  assert.strictEqual(events[0].duration, 1.5, "3 beats at 0.5 each merged into one held note");
  assert.strictEqual(events[1].midi, 69);
  assert.strictEqual(events[1].duration, 1.5);
  assert.strictEqual(events[2].rest, true);
  assert.strictEqual(events[2].duration, 1, "the 2 trailing gap beats merge into one 1-second rest, not 2 ticks");

  // A re-attack on the same pitch (not flagged `sustain`) must still become its own
  // discrete note, never merged into the previous one just because the pitch matches.
  const reattack = SongLessonKit.timelineToEvents([
    { midi: 70, sustain: false }, { midi: 70, sustain: false }, { midi: 67, sustain: true },
  ], 0.5);
  assert.strictEqual(reattack.length, 3, "a same-pitch re-attack and a held-but-different-pitch beat each stay their own note");
  assert.strictEqual(reattack[1].duration, 0.5);
  assert.strictEqual(reattack[2].midi, 67);

  // A song without `phrases` or `gapBeats` (the oldest fallback, songWithRhythm above)
  // still works: linePlaybackPlan just has no gap cells appended (0, not a crash).
  const fallbackPlan = SongLessonKit.linePlaybackPlan(songWithRhythm, 0);
  assert.strictEqual(fallbackPlan.cells.length, 7, "no gapBeats field means 0 gap cells, matching syl0's own 7 beats");

  console.log("songLessonKit.segmentsForLine.test.html: all assertions passed");
} catch (e) {
  console.error("songLessonKit.segmentsForLine.test.html: FAILED -", e.message);
}
</script>
</body></html>
