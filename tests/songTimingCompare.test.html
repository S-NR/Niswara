<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body>
<script src="../js/components/songTimingCompare.js"></script>
<script>
const assert = {
  strictEqual(a, b, msg) { if (a !== b) throw new Error(msg || `expected ${b}, got ${a}`); },
  ok(v, msg) { if (!v) throw new Error(msg || "expected truthy"); },
};

try {
  // Same pace
  let r = SongTimingCompare.compare(10.2, 10.17);
  assert.strictEqual(r.rating, "about the same pace as the reference");

  // Learner much faster (short span relative to reference)
  r = SongTimingCompare.compare(6, 10.17);
  assert.strictEqual(r.rating, "faster than the reference");

  // Learner much slower
  r = SongTimingCompare.compare(14, 10.17);
  assert.strictEqual(r.rating, "slower than the reference");

  // Missing/zero reference span -> honest fallback, never a fabricated rating
  r = SongTimingCompare.compare(5, 0);
  assert.strictEqual(r.rating, "hard to tell");
  assert.strictEqual(r.ratio, null);

  console.log("songTimingCompare.test.html: all assertions passed");
} catch (e) {
  console.error("songTimingCompare.test.html: FAILED -", e.message);
}
</script>
</body></html>
