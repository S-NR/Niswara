<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body>
<script src="../js/audio/pitchAnalysis.js"></script>
<script>
function buildWavBlob(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buf);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeStr(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, "data"); view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

(async () => {
  try {
    console.log("step1: building samples");
    const sr = 22050;
    const seconds = 4;
    const n = sr * seconds;
    const samples = new Float32Array(n);
    for (let i = 0; i < n; i++) samples[i] = 0.4 * Math.sin((2 * Math.PI * 440 * i) / sr);
    console.log("step2: building blob, bytes=", samples.length * 2 + 44);
    const blob = buildWavBlob(samples, sr);
    console.log("step3: blob built, size=", blob.size, "type=", blob.type);
    console.log("step4: calling PitchAnalysis.decode");
    const decoded = await PitchAnalysis.decode(blob);
    console.log("step5: decoded OK, sampleRate=", decoded.sampleRate, "len=", decoded.samples.length);
    const analysis = PitchAnalysis.analyzeSamples(decoded.samples, decoded.sampleRate);
    console.log("step6: analyzed, frames=", analysis.frames.length, "voicedSeconds=", analysis.voicedSeconds);
    console.log("DEBUG DONE OK");
  } catch (e) {
    console.error("DEBUG FAILED:", e.message, e.stack);
  }
})();
</script>
</body></html>
